<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏦 Banking Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- ============================================ -->
<!-- NAVBAR -->
<!-- ============================================ -->
<nav class="navbar navbar-custom">
    <div class="container">
            <span class="navbar-brand">
                <img th:src="@{/images/javbank_logo.png}"
                     alt="JAVA BANK LOGO"
                     height="80">
            </span>
        <span class="navbar-brand">
                <img th:src="@{/images/admin.png}"
                     alt="ADMIN"
                     height="70">
            </span>
    </div>
</nav>

<!-- ============================================ -->
<!-- MAIN CONTENT -->
<!-- ============================================ -->
<div class="container py-4">

    <!-- Stats Row -->
    <div class="row g-4 mb-4">
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                <div class="stat-label">Total Accounts</div>
                <div class="stat-value" th:text="${totalAccounts}">0</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-money-bill-wave"></i></div>
                <div class="stat-label">Total Bank Fund</div>
                <div class="stat-value">₱<span th:text="${#numbers.formatDecimal(totalBalance, 0, 2)}">0.00</span></div>
            </div>
        </div>
        <div class="col-md-6 col-6">
            <img th:src="@{/images/wora_tagline.jpg}"
                 alt="WORA - Write Once, Read Anywhere"
                 height="175"
                 width="100%"
            style="border-radius: 2%">
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-grid">
        <button class="action-btn" onclick="openModal('createAccount')">
            <i class="fas fa-plus-circle"></i>
            <span>Create Account</span>
        </button>
        <button class="action-btn" onclick="openModal('deposit')">
            <i class="fas fa-arrow-down"></i>
            <span>Deposit</span>
        </button>
        <button class="action-btn" onclick="openModal('withdraw')">
            <i class="fas fa-arrow-up"></i>
            <span>Withdraw</span>
        </button>
        <button class="action-btn" onclick="openModal('transfer')">
            <i class="fas fa-exchange-alt"></i>
            <span>Transfer</span>
        </button>
        <button class="action-btn" onclick="openModal('balance')">
            <i class="fas fa-search"></i>
            <span>Balance</span>
        </button>
        <button class="action-btn" onclick="openModal('miniStatement')">
            <i class="fas fa-receipt"></i>
            <span>Mini Statement</span>
        </button>
    </div>

    <!-- Accounts Table -->
    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4><i class="fas fa-list me-2" style="color:var(--primary);"></i>All Accounts</h4>
            <div>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="🔍 Search..."
                       style="width:200px;display:inline-block;">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover" id="accountsTable">
                <thead>
                <tr>
                    <th>Account Number</th>
                    <th>Account Name</th>
                    <th>Balance</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="accountsBody">
                <tr th:each="account : ${accounts}">
                    <td><strong th:text="${account.accountNumber}">ACC-001</strong></td>
                    <td th:text="${account.accountName}">John Doe</td>
                    <td class="balance-positive">₱<span
                            th:text="${#numbers.formatDecimal(account.balance, 0, 2)}">0.00</span></td>
                    <td th:text="${#temporals.format(account.createdAt, 'MMM dd, yyyy')}">Jan 01, 2024</td>
                    <td>
                        <!-- Using data attributes instead of th:onclick -->
                        <button class="btn btn-sm btn-outline-primary me-1 view-btn"
                                th:data-account="${account.accountNumber}">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success history-btn"
                                th:data-account="${account.accountNumber}">
                            <i class="fas fa-history"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- FOOTER -->
<!-- ============================================ -->
<footer style="background: var(--deep-navy); color: rgba(255,255,255,0.6); padding: 15px 0; margin-top: 40px; text-align: center; border-top: 2px solid var(--logo-red);">
    <div class="container">
        <small>&copy; 2026 JAVBANK. All Rights Reserved.</small>
        <br>
        <small style="font-size: 0.7rem;">WORA - Wallet Online, Ready Anytime</small>
    </div>
</footer>
<!-- ============================================ -->
<!-- MODAL -->
<!-- ============================================ -->
<div class="modal fade" id="actionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- TOAST NOTIFICATION -->
<!-- ============================================ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============================================ -->
<!-- SCRIPTS -->
<!-- ============================================ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
